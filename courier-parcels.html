<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parcel Locker — Pickups</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="d-flex justify-content-between align-items-center bg-white border-bottom p-3">
        <a class="brand text-decoration-none text-dark" href="home.html">📦 Smart Parcel Locker</a>
        <button class="btn btn-light btn-sm" id="logout-btn">Log Out</button>
    </div>

    <div class="page">
        <h1 class="h3">Parcels to Pick Up</h1>
        <p class="text-muted">Parcels assigned to you, waiting in lockers</p>

        <div id="parcel-list"></div>
        <p class="text-danger hidden" id="parcel-msg"></p>
        <p class="text-muted small mt-3">Go to the locker machine and choose "Collect a Parcel" to pick these up.</p>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/courier-parcels.js"></script>
</body>
</html>
