<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parcel Locker — Locker Status</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- top nav bar -->
    <div class="d-flex justify-content-between align-items-center bg-white border-bottom p-3">
        <a class="brand text-decoration-none text-dark" href="home.html">📦 Smart Parcel Locker</a>
        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-sm btn-primary" href="locker-status.html">Locker Status</a>
            <button class="btn btn-light btn-sm" id="logout-btn">Log Out</button>
        </div>
    </div>

    <div class="page" style="max-width:1040px;">
        <h1 class="h3">Locker Status</h1>
        <p class="text-muted" id="subtitle">Live overview of all lockers</p>

        <!-- status summary tiles -->
        <div class="row g-3" id="stat-row"></div>

        <!-- status color legend -->
        <div class="lk-legend mt-3">
            <span><i class="lk-dot lk-occupied"></i> Occupied</span>
            <span><i class="lk-dot lk-available"></i> Available</span>
            <span><i class="lk-dot lk-reserved"></i> Reserved</span>
            <span><i class="lk-dot lk-oos"></i> Out of service</span>
        </div>

        <!-- locker grid -->
        <div class="lk-grid mt-3" id="locker-grid"></div>
        <p class="text-danger hidden" id="lk-msg"></p>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/locker-status.js"></script>
</body>
</html>
