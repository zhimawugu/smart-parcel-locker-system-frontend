<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parcel Locker — My Parcels</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="d-flex justify-content-between align-items-center bg-white border-bottom p-3">
        <a class="brand text-decoration-none text-dark" href="home.html">📦 Smart Parcel Locker</a>
        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-sm btn-primary" href="my-parcels.html">My Parcels</a>
            <a class="btn btn-sm btn-light" href="manage.html">Send a Parcel</a>
            <a class="btn btn-sm btn-light" href="group.html">Group</a>
            <button class="btn btn-light btn-sm" id="logout-btn">Log Out</button>
        </div>
    </div>

    <div class="page">
        <h1 class="h3">My Parcels</h1>
        <p class="text-muted">Your parcels and collection codes</p>

        <h2 class="h6 mt-4">Waiting for collection</h2>
        <div id="parcel-list"></div>
        <p class="text-danger hidden" id="parcel-msg"></p>
        <p class="text-muted small mt-3">Codes are also sent to you by notification. Enter them at the locker machine to collect.</p>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/my-parcels.js"></script>
</body>
</html>
