<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parcel Locker — Collect Outbound</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="bar">
        <a class="btn btn-light btn-sm left" href="delivery-home.html">‹ Back</a>
        <div class="title">📦 Smart Parcel Locker</div>
        <div class="sub">Locker Machine · Building A</div>
    </div>

    <div class="page">
        <section id="list-view">
            <div class="card mx-auto" style="max-width:520px;">
                <div class="card-body">
                    <h1 class="h4 text-center">Parcels to Collect</h1>
                    <p class="sub text-center">Open each locker and take the parcel</p>
                    <div id="pickup-list"></div>
                    <p class="text-danger hidden" id="pickup-msg"></p>
                </div>
            </div>
        </section>

        <section id="opened-view" class="hidden">
            <div class="card mx-auto" style="max-width:440px;">
                <div class="card-body text-center">
                    <div class="check">✓</div>
                    <h2 class="h4">Locker Opened</h2>
                    <p class="text-muted">Take the parcel and close the door.</p>

                    <div class="locker-box">
                        <div class="label">LOCKER</div>
                        <div class="code" id="opened-locker">—</div>
                    </div>

                    <p class="sub mt-3">🔒 The door locks automatically once closed.</p>
                    <button class="btn btn-success w-100 mt-3" id="done-btn">Done</button>
                </div>
            </div>
        </section>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pickup-parcel.js"></script>
</body>
</html>
